<head>

<style>
:root{--bg:#f1f4fb;--card:#fff;--tx:#14182b;--mut:#6b7390;--pri:#5b3df5;--grn:#0a9e6e;--red:#e5384f;--amb:#d98200;--bd:#e3e7f3;--hd:#f8f9fe;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#1a1e33;--tx:#eef0fa;--mut:#9aa2c4;--bd:#2a3050;--hd:#151930;--pri:#8a74ff;--grn:#2ad39a;--red:#ff6b7f;--amb:#ffb340}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#1a1e33;--tx:#eef0fa;--mut:#9aa2c4;--bd:#2a3050;--hd:#151930;--pri:#8a74ff;--grn:#2ad39a;--red:#ff6b7f;--amb:#ffb340}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Hind Siliguri',system-ui,sans-serif;font-size:15px;padding-bottom:150px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hd);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:10px 14px}
header h1{font-size:18px;margin:0;flex:1}
.ib{background:none;border:0;font-size:20px;color:var(--tx);padding:4px 6px;cursor:pointer}
main{padding:14px;max-width:640px;margin:0 auto}
h2{font-size:16px;margin:18px 0 10px;border-left:4px solid var(--pri);padding-left:8px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px}
.c small{color:var(--mut);display:block}
.c b{font-size:22px;display:block;margin-top:4px}
.qa{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:16px;padding:14px 10px;color:var(--tx);font-family:inherit;font-size:14px}
.G{color:var(--grn)}.R{color:var(--red)}.A{color:var(--amb)}.P{color:var(--pri)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.bd{font-size:12px;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.bd.w{background:color-mix(in srgb,var(--amb) 18%,transparent);color:var(--amb)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 14px;font-family:inherit;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
input,select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-family:inherit;font-size:15px;margin-top:4px}
label{display:block;margin-top:10px;color:var(--mut);font-size:13px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-family:inherit;font-weight:600;font-size:14px;color:#fff;background:var(--pri);cursor:pointer}
.btn.g2{background:var(--grn)}.btn.o{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.p{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;cursor:pointer;text-align:left;color:var(--tx);font-family:inherit}
.p small{color:var(--mut);display:block;font-size:12px}
.p .n{font-weight:600;margin:4px 0 8px;display:block;min-height:40px}
.p .f{display:flex;justify-content:space-between;align-items:center}
.st{font-size:12px;border-radius:99px;padding:1px 9px;background:color-mix(in srgb,var(--grn) 16%,transparent);color:var(--grn)}
.st.l{background:color-mix(in srgb,var(--amb) 18%,transparent);color:var(--amb)}
.st.z{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.bar{position:fixed;left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:8px 10px;display:flex;align-items:center;gap:10px;z-index:8;box-shadow:0 6px 24px #0003}
.bar b{flex:1;font-size:20px}
nav{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--hd);border-top:1px solid var(--bd);display:flex;justify-content:space-around;z-index:9}
nav button{background:none;border:0;color:var(--mut);font-family:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:56px}
nav button span{font-size:21px}
nav button.on{color:var(--pri);font-weight:700}
nav .pos span{background:var(--pri);color:#fff;border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 4px 14px #5b3df566}
.ov{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--card);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sh h3{margin:0 0 6px}
.dr{position:fixed;top:0;bottom:0;left:0;width:80%;max-width:320px;background:var(--card);z-index:21;padding:calc(14px + env(safe-area-inset-top,0px)) 12px 20px;overflow:auto}
.dr h3{margin:0 0 8px;color:var(--pri)}
.mi{display:flex;align-items:center;gap:12px;padding:12px 8px;border-radius:12px;cursor:pointer}
.mi:hover{background:var(--bg)}
.tag{margin-left:auto}
.cols{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:8px}
.cols div{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.cols i{display:block;background:var(--pri);border-radius:6px 6px 0 0;min-height:3px;margin-bottom:3px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;border-radius:99px;padding:8px 16px;z-index:30;font-size:14px;display:none}
.em{text-align:center;color:var(--mut);padding:28px 0}
@media print{header,nav,.bar,.no-p,body::before{display:none!important}body{padding:0}}
</style>
</head>
<body>
<header><button class="ib" onclick="drawer(1)">☰</button><h1 id="ttl"></h1><button class="ib" onclick="theme()">🌓</button></header>
<main id="m"></main>
<div id="bar"></div>

<script>
var bt='list',bf='all',srt='due';
var S,view='dash',cat='সব',q='',cart={},dark=null;
var bn=function(n){return String(n).replace(/\d/g,function(d){return '০১২৩৪৫৬৭৮৯'[d]})};
var money=function(n){return '৳'+bn(Math.round(n).toLocaleString('en-US'))};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var ymd=function(t){var d=new Date(t);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()};
var ym=function(t){var d=new Date(t);return d.getFullYear()+'-'+d.getMonth()};
var sum=function(a,f){return a.reduce(function(x,s){return x+f(s)},0)};
var prof=function(s){return sum(s.items,function(i){return (i.p-i.c)*i.q})};
var cogs=function(s){return sum(s.items,function(i){return i.c*i.q})};
var val=function(id){return document.getElementById(id).value};
function seed(){var P=[['ঈমান সবার আগে','ইসলামিক বই',80,6],['আবে হায়াত','উপন্যাস',765,1],['আমি পদ্মজা','উপন্যাস',560,1],['তুমি ছিলে বলেই','উপন্যাস',390,2],['এলিজা','উপন্যাস',525,2],['হায়াতুস সাহাবা','ইসলামিক বই',1380,1],['সময়ের মূল্য','ইসলামিক বই',150,10],['সমকালিন বিশ্ব ২','ইসলামিক বই',400,2],['সমকালিন বিশ্ব ১','ইসলামিক বই',400,2],['কুররাতু আইয়ুন ২','ইসলামিক বই',202,2]];
return {shop:'আমারদোকান',products:P.map(function(p,i){return {id:i+1,name:p[0],cat:p[1],sell:p[2],buy:Math.round(p[2]*0.85),stock:p[3]}}),customers:[{id:1,name:'ইউ নাইম',phone:'0173948092',due:345}],sales:[],expenses:[],nid:20}}
function load(){try{var x=localStorage.getItem('ad_v1');if(x)return JSON.parse(x)}catch(e){}return seed()}
function save(){try{localStorage.setItem('ad_v1',JSON.stringify(S))}catch(e){}}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none'},1800)}
function theme(){var r=document.documentElement;var isD=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);r.setAttribute('data-theme',isD?'light':'dark')}
function go(v){view=v;drawer(0);modal(0);render()}
function modal(h){document.getElementById('layer').innerHTML=h?'<div class="ov" onclick="if(event.target==this)modal(0)"><div class="sh">'+h+'</div></div>':''}
function drawer(o){var h='';if(o){var it=[['dash','📊','ড্যাশবোর্ড'],['pos','🛒','POS / বিক্রয়'],['sales','🧾','ক্যাশ মেমো'],['stock','📦','সকল পণ্য'],['baki','🤝','বাকির খাতা'],['cust','👥','কাস্টমার'],['exp','💸','খরচ'],['set','⚙️','সেটিংস']],lk=['কোটেশন','EMI / কিস্তি','রিপোর্টস','ব্রাঞ্চ'];
h='<div class="ov" onclick="if(event.target==this)drawer(0)"><div class="dr"><h3>'+esc(S.shop)+'</h3>'+it.map(function(x){return '<div class="mi" onclick="go(\''+x[0]+'\')"><span>'+x[1]+'</span>'+x[2]+'</div>'}).join('')+lk.map(function(x){return '<div class="mi" onclick="toast(\'শীঘ্রই আসছে\')"><span>🔒</span>'+x+'</div>'}).join('')+'</div></div>'}
document.getElementById('layer').innerHTML=h}
function card(l,v,c){return '<div class="c"><small>'+l+'</small><b class="'+(c||'')+'">'+v+'</b></div>'}
function dash(){var t=Date.now(),td=S.sales.filter(function(s){return ymd(s.t)==ymd(t)}),mo=S.sales.filter(function(s){return ym(s.t)==ym(t)});
var due=sum(S.customers,function(c){return c.due}),dc=S.customers.filter(function(c){return c.due>0}).length;
var texp=sum(S.expenses.filter(function(e){return ymd(e.t)==ymd(t)}),function(e){return e.a}),mexp=sum(S.expenses.filter(function(e){return ym(e.t)==ym(t)}),function(e){return e.a});
var ts=sum(td,function(s){return s.total}),tp=sum(td,prof),ms=sum(mo,function(s){return s.total});
var days=[];for(var i=6;i>=0;i--){var d=new Date(t-i*864e5);days.push({l:bn(d.getDate()),v:sum(S.sales.filter(function(s){return ymd(s.t)==ymd(d)}),function(s){return s.total})})}
var mx=Math.max.apply(null,days.map(function(d){return d.v}).concat([1]));
var low=S.products.filter(function(p){return p.stock<=2}).sort(function(a,b){return a.stock-b.stock});
var top={};mo.forEach(function(s){s.items.forEach(function(i){top[i.n]=top[i.n]||{r:0,q:0};top[i.n].r+=i.p*i.q;top[i.n].q+=i.q})});
var tl=Object.keys(top).sort(function(a,b){return top[b].r-top[a].r}).slice(0,3);
return '<div class="g">'+[['stock','📦 পণ্য যোগ করুন','addP()'],['pos','🚚 নতুন ক্রয়','go(\'stock\')'],['','👤 নতুন কাস্টমার','addC()'],['','🧾 ক্যাশ মেমো','go(\'pos\')']].map(function(x){return '<button class="qa" onclick="'+x[2]+'">'+x[1]+'</button>'}).join('')+'</div>'+
'<h2>আজকের হিসাব</h2><div class="g">'+card('আজকের বিক্রয়',money(ts))+card('আজকের লাভ',money(tp),'G')+card('আজকের খরচ',money(texp),'R')+card('মোট বকেয়া',money(due),'A')+'</div>'+
'<h2>এই মাসের হিসাব</h2><div class="g">'+card('মোট বিক্রি',money(ms),'P')+card('পণ্য কেনার খরচ',money(sum(mo,cogs)))+card('দোকান খরচ',money(mexp),'R')+card('লাভ',money(sum(mo,prof)-mexp),'G')+'</div>'+
'<h2>বিক্রয়ের ধারা (৭ দিন)</h2><div class="c"><small>৭ দিনে মোট '+money(sum(days,function(d){return d.v}))+'</small><div class="cols">'+days.map(function(d){return '<div><i style="height:'+Math.round(d.v/mx*90)+'px"></i>'+d.l+'</div>'}).join('')+'</div></div>'+
'<h2>স্টক ফুরিয়ে আসছে ('+bn(low.length)+'টি)</h2><div class="c">'+(low.length?low.slice(0,6).map(function(p){return '<div class="row"><span>'+esc(p.name)+'</span><span class="bd '+(p.stock?'w':'')+'">'+(p.stock?'বাকি '+bn(p.stock):'শেষ')+'</span></div>'}).join(''):'<div class="em">সব পণ্য স্টকে আছে</div>')+'</div>'+
'<h2>এই মাসের সেরা পণ্য</h2><div class="c">'+(tl.length?tl.map(function(n,i){return '<div class="row"><span>'+bn(i+1)+'. '+esc(n)+'<small style="color:var(--mut)"> · '+bn(top[n].q)+' পিস</small></span><b class="P">'+money(top[n].r)+'</b></div>'}).join(''):'<div class="em">এখনো কোনো বিক্রি নেই</div>')+'</div>'}
function pos(){var cs=['সব'].concat(S.products.map(function(p){return p.cat}).filter(function(v,i,a){return a.indexOf(v)==i}));
var L=S.products.filter(function(p){return (cat=='সব'||p.cat==cat)&&p.name.indexOf(q)>-1});
return '<input placeholder="🔍 পণ্য খুঁজুন..." value="'+esc(q)+'" oninput="q=this.value;pl()"><div class="chips" style="margin-top:10px">'+cs.map(function(c){return '<button class="chip '+(c==cat?'on':'')+'" onclick="cat=\''+c+'\';render()">'+c+'</button>'}).join('')+'</div><div class="pg" id="pg">'+pg(L)+'</div>'}
function pg(L){return L.map(function(p){return '<button class="p" onclick="add('+p.id+')"><small>'+p.cat+'</small><span class="n">'+esc(p.name)+'</span><div class="f"><b class="G">'+money(p.sell)+'</b><span class="st '+(p.stock==0?'z':p.stock<=2?'l':'')+'">'+bn(p.stock)+'</span></div></button>'}).join('')||'<div class="em" style="grid-column:1/-1">কোনো পণ্য নেই</div>'}
function pl(){document.getElementById('pg').innerHTML=pg(S.products.filter(function(p){return (cat=='সব'||p.cat==cat)&&p.name.indexOf(q)>-1}))}
function P(id){return S.products.filter(function(p){return p.id==id})[0]}
function add(id){var p=P(id);if(!p.stock){toast('স্টক নেই');return}if((cart[id]||0)>=p.stock){toast('স্টকের বেশি নেওয়া যাবে না');return}cart[id]=(cart[id]||0)+1;bar()}
function ctotal(){return Object.keys(cart).reduce(function(x,id){return x+P(id).sell*cart[id]},0)}
function bar(){var n=Object.keys(cart).length,b=document.getElementById('bar');b.innerHTML=(view=='pos')?'<div class="bar"><b>'+money(ctotal())+'</b><button class="btn" onclick="cartM()">🛒 কার্ট ('+bn(n)+')</button></div>':''}
function cartM(){var ids=Object.keys(cart);if(!ids.length){toast('কার্ট খালি');return}
modal('<h3>কার্ট</h3>'+ids.map(function(id){var p=P(id);return '<div class="row"><span>'+esc(p.name)+'<small style="color:var(--mut);display:block">'+money(p.sell)+' × '+bn(cart[id])+'</small></span><span><button class="btn o" onclick="qty('+id+',-1)">−</button> <button class="btn o" onclick="qty('+id+',1)">+</button></span></div>'}).join('')+
'<div class="row"><b>মোট</b><b class="G">'+money(ctotal())+'</b></div><label>কাস্টমার (বাকির জন্য)</label><select id="cu"><option value="0">ক্যাশ কাস্টমার</option>'+S.customers.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('')+'</select><label>পরিশোধ (৳)</label><input id="pd" type="number" inputmode="numeric" value="'+ctotal()+'"><div style="display:flex;gap:8px;margin-top:14px"><button class="btn o" onclick="cart={};modal(0);bar()">খালি করুন</button><button class="btn g2" style="flex:1" onclick="sell()">বিক্রি সম্পন্ন করুন</button></div>')}
function qty(id,d){var p=P(id),n=(cart[id]||0)+d;if(n>p.stock){toast('স্টক শেষ');return}if(n<=0)delete cart[id];else cart[id]=n;bar();Object.keys(cart).length?cartM():modal(0)}
function sell(){var ids=Object.keys(cart),tot=ctotal(),pd=Math.min(Math.max(+val('pd')||0,0),tot),cu=+val('cu');
if(pd<tot&&!cu){toast('বাকি দিতে কাস্টমার বাছাই করুন');return}
S.sales.push({id:S.nid++,t:Date.now(),total:tot,paid:pd,cu:cu,items:ids.map(function(id){var p=P(id);p.stock-=cart[id];return {n:p.name,q:cart[id],p:p.sell,c:p.buy}})});
if(cu&&tot>pd){var cc=CU(cu);cc.due+=tot-pd;cc.last=Date.now()}
cart={};save();modal(0);toast('বিক্রি সম্পন্ন ✓');render()}
var iso=function(t){var d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function inR(t,f){if(f=='all')return true;if(f=='today')return ymd(t)==ymd(Date.now());return Date.now()-t<=(+f)*864e5}
function lvl(d){return d>=5000?['High','']:d>=1000?['Medium','w']:['Low','w']}
function CU(id){return S.customers.filter(function(c){return c.id==id})[0]}
function smsH(c){return 'sms:'+c.phone+'?body='+encodeURIComponent('প্রিয় '+c.name+', আপনার বকেয়া '+money(c.due)+'। অনুগ্রহ করে পরিশোধ করুন। — '+S.shop)}
function baki(){var t=Date.now(),pays=S.pays||[],due=sum(S.customers,function(c){return c.due}),dc=S.customers.filter(function(c){return c.due>0}).length;
var tdp=sum(pays.filter(function(p){return ymd(p.t)==ymd(t)}),function(p){return p.a}),m30=sum(pays.filter(function(p){return t-p.t<=30*864e5}),function(p){return p.a}),pr=S.customers.filter(function(c){return c.rem==iso(t)}).length;

+card('মোট বকেয়া · '+bn(dc)+' জন',money(due),'R')
