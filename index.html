<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>আরাফাত শপ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5b3df5">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f4fb;--card:#fff;--tx:#14182b;--mut:#6b7390;--pri:#5b3df5;--grn:#0a9e6e;--red:#e5384f;--amb:#d98200;--bd:#e3e7f3;--hd:#f8f9fe;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#1a1e33;--tx:#eef0fa;--mut:#9aa2c4;--bd:#2a3050;--hd:#151930;--pri:#8a74ff;--grn:#2ad39a;--red:#ff6b7f;--amb:#ffb340}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#1a1e33;--tx:#eef0fa;--mut:#9aa2c4;--bd:#2a3050;--hd:#151930;--pri:#8a74ff;--grn:#2ad39a;--red:#ff6b7f;--amb:#ffb340}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Hind Siliguri',system-ui,sans-serif;font-size:15px;padding-bottom:150px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hd);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:10px 14px}
header h1{font-size:18px;margin:0;flex:1}
.ib{background:none;border:0;font-size:20px;color:var(--tx);padding:4px 6px;cursor:pointer}
main{padding:14px;max-width:640px;margin:0 auto}
h2{font-size:16px;margin:18px 0 10px;border-left:4px solid var(--pri);padding-left:8px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px}
.c small{color:var(--mut);display:block}
.c b{font-size:22px;display:block;margin-top:4px}
.qa{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:16px;padding:14px 10px;color:var(--tx);font-family:inherit;font-size:14px}
.G{color:var(--grn)}.R{color:var(--red)}.A{color:var(--amb)}.P{color:var(--pri)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.bd{font-size:12px;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.bd.w{background:color-mix(in srgb,var(--amb) 18%,transparent);color:var(--amb)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 14px;font-family:inherit;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
input,select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-family:inherit;font-size:15px;margin-top:4px}
label{display:block;margin-top:10px;color:var(--mut);font-size:13px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-family:inherit;font-weight:600;font-size:14px;color:#fff;background:var(--pri);cursor:pointer}
.btn.g2{background:var(--grn)}.btn.o{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.p{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;cursor:pointer;text-align:left;color:var(--tx);font-family:inherit}
.p small{color:var(--mut);display:block;font-size:12px}
.p .n{font-weight:600;margin:4px 0 8px;display:block;min-height:40px}
.p .f{display:flex;justify-content:space-between;align-items:center}
.st{font-size:12px;border-radius:99px;padding:1px 9px;background:color-mix(in srgb,var(--grn) 16%,transparent);color:var(--grn)}
.st.l{background:color-mix(in srgb,var(--amb) 18%,transparent);color:var(--amb)}
.st.z{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.bar{position:fixed;left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:8px 10px;display:flex;align-items:center;gap:10px;z-index:8;box-shadow:0 6px 24px #0003}
.bar b{flex:1;font-size:20px}
nav{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--hd);border-top:1px solid var(--bd);display:flex;justify-content:space-around;z-index:9}
nav button{background:none;border:0;color:var(--mut);font-family:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:56px}
nav button span{font-size:21px}
nav button.on{color:var(--pri);font-weight:700}
nav .pos span{background:var(--pri);color:#fff;border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 4px 14px #5b3df566}
.ov{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--card);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sh h3{margin:0 0 6px}
.dr{position:fixed;top:0;bottom:0;left:0;width:80%;max-width:320px;background:var(--card);z-index:21;padding:calc(14px + env(safe-area-inset-top,0px)) 12px 20px;overflow:auto}
.dr h3{margin:0 0 8px;color:var(--pri)}
.mi{display:flex;align-items:center;gap:12px;padding:12px 8px;border-radius:12px;cursor:pointer}
.mi:hover{background:var(--bg)}
.tag{margin-left:auto}
.cols{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:8px}
.cols div{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.cols i{display:block;background:var(--pri);border-radius:6px 6px 0 0;min-height:3px;margin-bottom:3px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;border-radius:99px;padding:8px 16px;z-index:30;font-size:14px;display:none}
.em{text-align:center;color:var(--mut);padding:28px 0}
@media print{header,nav,.bar,.no-p,body::before{display:none!important}body{padding:0}}
.av{width:30px;height:30px;border-radius:10px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}#bg{position:absolute;top:-2px;right:-2px;background:#ff2d55;color:#fff;border-radius:99px;font-size:10px;min-width:16px;height:16px;display:none;align-items:center;justify-content:center}.hs{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}.hs h2{margin:0}.lk{background:none;border:1px solid var(--bd);color:var(--pri);border-radius:99px;padding:4px 12px;font-family:inherit;cursor:pointer;background:var(--card)}.pb{height:7px;border-radius:9px;background:var(--bd);margin-top:6px}.pb i{display:block;height:100%;border-radius:9px;background:var(--pri)}.x{background:none;border:0;color:var(--amb);font-size:18px;cursor:pointer}
.sw{width:52px;height:30px;border-radius:99px;background:var(--bd);border:0;position:relative;cursor:pointer;flex:none}.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--grn)}.sw.on:after{left:25px}
@media print{body.pm main,body.pm #bar{display:none}body.pm .ov{position:static;background:none;display:block}body.pm .sh{max-height:none}body.pm .sh button{display:none}}
textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-family:inherit;font-size:15px;margin-top:4px}details{border-bottom:1px solid var(--bd);padding:10px 0}summary{font-weight:600;cursor:pointer}
.p{position:relative}.p.sel{border-color:var(--grn);background:color-mix(in srgb,var(--grn) 9%,var(--card))}
.qb{position:absolute;top:-8px;right:-8px;min-width:24px;height:24px;border-radius:99px;background:var(--grn);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.fs{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.fh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);font-size:18px}
.fb{flex:1;overflow:auto;padding:12px 14px 20px}
.fbar{background:#161d33;color:#fff;border-radius:22px;margin:10px 12px calc(10px + env(safe-area-inset-bottom,0px));padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ps{background:var(--card);border-radius:24px 24px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px #0003}
.ci{background:color-mix(in srgb,var(--red) 7%,var(--card));border:1px solid var(--bd);border-left:4px solid var(--red);border-radius:18px;padding:12px;margin-top:10px}
.qs{display:flex;border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--card)}.qs button{border:0;background:none;color:var(--tx);width:34px;font-size:18px;cursor:pointer}.qs input{width:44px;margin:0;border:0;border-radius:0;text-align:center;padding:6px 0}
.sm{width:80px;margin:0;padding:6px 10px;border-radius:99px;text-align:center}
.iw{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:0 12px;margin-top:10px}.iw input{border:0;margin:0;background:none;padding:14px 0;flex:1;min-width:0}
.tg{flex:1;border:0;border-radius:12px;padding:12px;background:none;color:var(--mut);font-family:inherit;font-weight:600;font-size:15px;cursor:pointer}.tg.on{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff}
.fs{inset:auto;left:0;right:0;z-index:12;padding-top:0}
.fbw{background:var(--card);border-radius:26px 26px 0 0;padding:10px 10px 8px;box-shadow:0 -6px 24px #0002}.fbw .fbar{margin:0;display:grid;grid-template-columns:1fr auto 1fr;gap:8px}
.ps{position:relative}
.iw2{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:8px 12px;margin-top:12px}.iw2 .ic{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}.iw2 input{border:0;margin:0;background:none;padding:10px 0;flex:1;min-width:0;font-size:17px}
</style>
</head>
<body>
<header><button class="ib" onclick="drawer(1)">☰</button><h1 id="ttl"></h1><button class="ib" onclick="go('help')">▶️</button><button class="ib" onclick="toast('ডাটা এই ফোনেই সংরক্ষিত ☁')">☁️</button><button class="ib" onclick="theme()">🌓</button><button class="ib" onclick="bell()" style="position:relative">🔔<b id="bg"></b></button><button class="ib" onclick="go('set')"><span class="av" id="av">M</span></button></header>
<main id="m"></main>
<div id="bar"></div>
<nav id="nav"></nav>
<div id="toast"></div>
<div id="layer"></div>
<script>
var cam=null,camT=null,lastBC='',lastAt=0,cfr='30',rtab='n',stt='l',mq='',stab='p',hid=0,em=0,ec='all',stb='s',dd=0,tr=7,sa=false,bt='list',bf='all',srt='due';
var S,view='dash',cat='সব',q='',cart={},dark=null;
var bn=function(n){return String(n).replace(/\d/g,function(d){return '০১২৩৪৫৬৭৮৯'[d]})};
var money=function(n){return '৳'+bn(Math.round(n).toLocaleString('en-US'))};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var ymd=function(t){var d=new Date(t);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()};
var ym=function(t){var d=new Date(t);return d.getFullYear()+'-'+d.getMonth()};
var sum=function(a,f){return a.reduce(function(x,s){return x+f(s)},0)};
var prof=function(s){return sum(s.items,function(i){return (i.p-i.c)*i.q})-(s.disc||0)};
var cogs=function(s){return sum(s.items,function(i){return i.c*i.q})};
var val=function(id){return document.getElementById(id).value};
function seed(){return {shop:'আরাফাত শপ',uname:'আরাফাত শপ',products:[],customers:[],sales:[],expenses:[],nid:1}}
function load(){var d=null;try{var x=localStorage.getItem('ad_v1');if(x)d=JSON.parse(x)}catch(e){}if(!d||!d.products)return seed();
if(d.shop=='আমারদোকান')d.shop='আরাফাত শপ';if(!d.uname)d.uname='আরাফাত শপ';
var demo=d.products.length==10&&d.products[0].name=='ঈমান সবার আগে'&&!(d.sales||[]).length&&!(d.expenses||[]).length&&!(d.purs||[]).length&&(d.customers||[]).length==1&&d.customers[0].name=='ইউ নাইম';
if(demo){d.products=[];d.customers=[]}
return d}
function save(){try{localStorage.setItem('ad_v1',JSON.stringify(S))}catch(e){}}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none'},1800)}
function theme(){var r=document.documentElement;var isD=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);r.setAttribute('data-theme',isD?'light':'dark')}
function go(v){view=v;drawer(0);modal(0);render()}
function modal(h){stopCam();document.getElementById('layer').innerHTML=h?'<div class="ov" onclick="if(event.target==this)modal(0)"><div class="sh">'+h+'</div></div>':''}
function stopCam(){if(camT){clearInterval(camT);camT=null}if(cam){cam.getTracks().forEach(function(t){t.stop()});cam=null}}
function scanAdd(c){c=String(c).trim();if(!c)return;var p=S.products.filter(function(x){return x.barcode&&x.barcode==c})[0];if(!p){toast('এই বারকোডের পণ্য নেই');return}add(p.id);var e=document.getElementById('sc');if(e)e.textContent='🛒 '+bn(Object.keys(cart).length)+'টি পণ্য · '+money(ctotal());if(navigator.vibrate)navigator.vibrate(60)}
function scan(){modal('<h3>বারকোড স্ক্যান</h3><div style="background:#000;border-radius:16px;overflow:hidden;min-height:160px"><video id="cv" playsinline muted style="width:100%;display:block"></video></div><small id="cs" style="color:var(--mut);display:block;margin-top:6px">ক্যামেরা চালু হচ্ছে...</small><label>অথবা বারকোড লিখুন (স্ক্যানার থাকলে সরাসরি পড়ুন)</label><div style="display:flex;gap:8px"><input id="bm" style="margin:0" onkeydown="if(event.key===\'Enter\'){scanAdd(this.value);this.value=\'\'}"><button class="btn" onclick="var e=document.getElementById(\'bm\');scanAdd(e.value);e.value=\'\'">যোগ</button></div><div class="row" style="margin-top:8px"><b id="sc">🛒 '+bn(Object.keys(cart).length)+'টি পণ্য · '+money(ctotal())+'</b><button class="btn g2" onclick="modal(0);cartM()">কার্ট দেখুন</button></div>');
var cs=document.getElementById('cs');if(!navigator.mediaDevices||!window.BarcodeDetector){cs.textContent='এই ব্রাউজারে ক্যামেরা স্ক্যান চলে না, নিচে বারকোড লিখুন';return}
var det=new BarcodeDetector(),v=document.getElementById('cv');
navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(st){if(!document.getElementById('cv')){st.getTracks().forEach(function(t){t.stop()});return}cam=st;v.srcObject=st;v.play();cs.textContent='বারকোড ক্যামেরার সামনে ধরুন';camT=setInterval(function(){if(v.readyState<2)return;det.detect(v).then(function(r){if(r.length){var c=r[0].rawValue,n=Date.now();if(c!=lastBC||n-lastAt>2000){lastBC=c;lastAt=n;scanAdd(c)}}}).catch(function(){})},350)}).catch(function(){var e=document.getElementById('cs');if(e)e.textContent='ক্যামেরার অনুমতি পাওয়া যায়নি, নিচে বারকোড লিখুন'})}
function editP(id){var p=P(id);modal('<h3>পণ্য সম্পাদনা</h3><label>নাম</label><input id="en1" value="'+esc(p.name)+'"><label>ক্যাটাগরি</label><input id="ec1" value="'+esc(p.cat)+'"><label>ক্রয়মূল্য</label><input id="eb1" type="number" inputmode="numeric" value="'+p.buy+'"><label>বিক্রয়মূল্য</label><input id="es1" type="number" inputmode="numeric" value="'+p.sell+'"><label>বারকোড</label><input id="ek1" value="'+esc(p.barcode||'')+'"><div style="display:flex;gap:8px;margin-top:14px"><button class="btn o" style="color:var(--red)" onclick="delP('+id+')">মুছুন</button><button class="btn" style="flex:1" onclick="saveEP('+id+')">সংরক্ষণ</button></div>')}
function saveEP(id){var p=P(id),n=val('en1').trim(),s=+val('es1');if(!n||!s){toast('নাম ও বিক্রয়মূল্য দিন');return}p.name=n;p.cat=val('ec1')||'অন্যান্য';p.buy=+val('eb1')||0;p.sell=s;p.barcode=val('ek1').trim();save();modal(0);toast('সংরক্ষিত ✓');render()}
function delP(id){if(confirm('পণ্যটি মুছবেন? আগের বিক্রির হিসাব থাকবে।')){S.products=S.products.filter(function(p){return p.id!=id});delete cart[id];save();modal(0);render()}}
var VER='v8',pmOpen=false,ctype='cust',cph='',cnm='',cad='',cr={},cd={},cdisc=0,cpm='ক্যাশ',crec=0,csms=false,cnote='',payOpen=false;
function lineT(id){var p=P(id),r=cr[id]!=null?cr[id]:p.sell;return r*(1-(cd[id]||0)/100)*cart[id]}
function ctotal(){return Object.keys(cart).reduce(function(x,id){return x+lineT(id)},0)}
function netT(){return Math.max(0,ctotal()-(+cdisc||0))}
function bar(){var n=Object.keys(cart).length,b=document.getElementById('bar');b.innerHTML=(view=='pos')?'<div class="bar"><b style="background:var(--bg);border-radius:14px;padding:10px 14px">'+money(ctotal())+'</b><button class="btn" style="background:linear-gradient(135deg,#ff9500,#f55f00)" onclick="scan()">📷 স্ক্যান</button><button class="btn g2" style="position:relative" onclick="cartM()">🛒 কার্ট'+(n?'<span class="qb" style="background:#ff2d55">'+bn(n)+'</span>':'')+'</button></div>':''}
function cartM(){if(!Object.keys(cart).length){toast('কার্ট খালি');return}stopCam();payOpen=false;pmOpen=false;cartV()}
function qty(id,d){var p=P(id),n=(cart[id]||0)+d;if(n>p.stock){toast('স্টক শেষ');return}if(n<=0){delete cart[id];delete cr[id];delete cd[id]}else cart[id]=n;bar();cartV()}
function cqs(id,v){v=Math.floor(+v||0);var p=P(id);if(v>p.stock){toast('স্টক নেই');v=p.stock}if(v<=0){delete cart[id];delete cr[id];delete cd[id]}else cart[id]=v;bar();cartV()}
function crm(id){delete cart[id];delete cr[id];delete cd[id];bar();cartV()}
function lkp(){var c=S.customers.filter(function(x){return x.phone&&x.phone==cph.trim()})[0];if(c){cnm=c.name;cad=c.address||'';var a=document.getElementById('f_nm'),b=document.getElementById('f_ad');if(a)a.value=cnm;if(b)b.value=cad}}
